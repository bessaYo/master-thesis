[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "slicer-project"
version = "0.1"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "numpy>=2.3.0",
    "matplotlib>=3.10.0",
    "networkx>=3.5",
    "tqdm>=4.67.0",
    "rich>=14.2.0",
    "pytest>=9.0.0",
    "scikit-learn>=1.6.0",
]

[tool.setuptools]
packages = { find = {} }

[tool.ruff]
line-length = 200

[tool.pytest.ini_options]
pythonpath = ["."]
